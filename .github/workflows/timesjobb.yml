# Sikkerhetsnettet for timesjobben.
#
# Serveren kjører timesjobben selv hver time (web/lib/timesjobb.ts). Denne
# kaller /api/varsler/paaminnelser i tillegg, så jobben går selv om
# tidtakeren i serveren skulle stoppe — og et mislykket kall sender en
# e-post fra GitHub av seg selv, så et brudd ikke blir stille.
#
# Den var eneste kilde en stund, men GitHub kjører planlagte jobber bare
# når det er ledig kapasitet: det ble seks kjøringer i døgnet i stedet for
# 24, med opptil 6,6 timer mellom. Derfor er den ikke lenger det eneste.
# To kall samtidig gjør ingenting — serveren slipper bare én runde til om
# gangen, og alt som sendes merkes.
#
# Krever to ting under Settings på repoet:
#   Secrets and variables → Actions → Secrets:   CRON_SECRET
#   Secrets and variables → Actions → Variables: APP_URL (f.eks. https://skjold.online)

name: Timesjobb

on:
  schedule:
    # Kvart over hver time, ikke hel time. GitHub dropper flest planlagte
    # jobber på hel time, når alle andre også har lagt sine.
    - cron: "17 * * * *"
  # Lar deg kjøre den for hånd fra Actions-fanen, uten å vente på timen.
  workflow_dispatch:

# To kjøringer samtidig ville ikke skadet — alt som sendes merkes som
# sendt — men det er ingen grunn til å la dem stå i kø heller.
concurrency:
  group: timesjobb
  cancel-in-progress: false

jobs:
  kall:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Kall varslingsruta
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET mangler. Legg den inn under Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ -z "${APP_URL:-}" ]; then
            echo "APP_URL mangler. Legg den inn som variabel samme sted, f.eks. https://skjold.online"
            exit 1
          fi

          # --fail gjør at en 401 eller 500 stopper jobben, slik at GitHub
          # sender deg en e-post om det i stedet for at det blir stille.
          # --retry tar en server som hikker eller er midt i en utrulling.
          # Bevisst uten --retry-all-errors: en 401 er feil oppsett, og skal
          # feile med en gang i stedet for å prøves fire ganger.
          svar=$(curl --fail --silent --show-error --max-time 120 \
            --retry 3 --retry-delay 10 \
            -H "authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/varsler/paaminnelser")

          echo "$svar"
